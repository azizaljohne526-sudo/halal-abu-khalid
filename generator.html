<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد أكواد حلال أبو خالد</title>
<style>
body{
  font-family:Arial;
  background:#f3f3f3;
  text-align:center;
  padding:40px 15px;
}
.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 4px 15px #bbb;
}
input{
  width:90%;
  padding:15px;
  font-size:20px;
  text-align:center;
  margin:15px 0;
}
button{
  padding:14px 25px;
  font-size:18px;
  cursor:pointer;
}
#result{
  font-size:25px;
  font-weight:bold;
  margin-top:25px;
}
</style>
</head>

<body>

<div class="box">
<h2>🔐 مولد أكواد التفعيل</h2>
<p>حلال أبو خالد</p>

<input id="device" placeholder="ضع رقم الجهاز هنا">

<br>

<button onclick="makeCode()">إنشاء كود التفعيل</button>

<div id="result"></div>
</div>

<script>
async function makeCode(){

 let d=document.getElementById("device").value.trim().toUpperCase();

 if(!d){
   alert("أدخل رقم الجهاز");
   return;
 }

 const x=new TextEncoder().encode(d+"|ABU-KHALID-2026");
 const h=await crypto.subtle.digest("SHA-256",x);

 const code=Array.from(new Uint8Array(h))
 .slice(0,6)
 .map(b=>b.toString(16).padStart(2,"0"))
 .join("")
 .toUpperCase();

 document.getElementById("result").innerHTML=
 "كود التفعيل:<br><br>"+code;
}
</script>

</body>
</html>
